name: Download and Update Código Fonte da Calculadora da Reforma Tributária

on:
  schedule:
    - cron: "17 0 * * *" # Runs every day at 0:17 AM UTC
      timezone: "UTC"
      
    - cron: "17 3 * * *" # Runs every day at 3:17 AM UTC, certificate
      timezone: "UTC"

  workflow_dispatch: # Allows manual triggering of the workflow

jobs:
  main:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 'write' access to repository contents

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-tags: true

      - name: Get download URL from API
        id: get_url
        run: |
          DOWNLOAD_URL=$(curl -s "https://piloto-cbs.tributos.gov.br/servico/calculadora-consumo/api/calculadora/download/url?platform=default" | jq -r '.downloadUrl')
          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" = "null" ]; then
            echo "::error::A API não retornou uma URL de download válida. Resposta: $DOWNLOAD_URL"
            exit 1
          fi
          echo "Download URL: $DOWNLOAD_URL"
          echo "download_url=$DOWNLOAD_URL" >> $GITHUB_OUTPUT

      - name: Download application
        id: download
        run: |
          DOWNLOAD_URL="${{ steps.get_url.outputs.download_url }}"

          # Derive the filename from the URL (last path segment, without query params)
          FILENAME=$(basename "${DOWNLOAD_URL%%\?*}")

          # Fallback: if the URL has no identifiable filename segment, use a default name
          if [ -z "$FILENAME" ] || [ "$FILENAME" = "." ]; then
            FILENAME="calculadora.zip"
            echo "::warning::Não foi possível extrair o nome do arquivo da URL; usando fallback '$FILENAME'"
          fi

          echo "Downloaded filename: $FILENAME"
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT

          curl -L -o "$FILENAME" "$DOWNLOAD_URL"

      - name: Unzip application and check for new version
        id: check_version
        run: |
          FILENAME="${{ steps.download.outputs.filename }}"

          # Unzip the outer archive — the inner zip is always named codigo-fonte-backend.zip
          unzip "$FILENAME"
          SOURCE_ZIP="./codigo-fonte-backend.zip"
          echo "source_zip=$SOURCE_ZIP" >> $GITHUB_OUTPUT

          NEW_HASH=$(md5sum "$SOURCE_ZIP" | awk '{print $1}')
          OLD_HASH=""
          if [ -f source.md5 ]; then
            OLD_HASH=$(cat source.md5)
          fi

          if [ "$NEW_HASH" != "$OLD_HASH" ]; then
            echo "New version found. Updating files."
            echo "is_new_version=true" >> $GITHUB_ENV
            echo "$NEW_HASH" > source.md5

            # Capture the modification date of the inner zip (ISO-8601, seconds precision)
            FILE_DATE=$(date -d "@$(stat -c '%Y' "$SOURCE_ZIP")" +'%Y-%m-%dT%H:%M:%S')
            echo "codigo-fonte-backend.zip date: $FILE_DATE"
            echo "source_zip_date=$FILE_DATE" >> $GITHUB_OUTPUT
          else
            echo "No new version found."
            echo "is_new_version=false" >> $GITHUB_ENV
          fi

      - name: Extract and validate database from Docker image
        id: database
        if: env.is_new_version == 'true'
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t IMAGE_ARCHIVES < <(find . -maxdepth 2 -type f -name '*.tar.gz' -print)

          if [ "${#IMAGE_ARCHIVES[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um arquivo .tar.gz da imagem Docker; encontrados: ${#IMAGE_ARCHIVES[@]}."
            exit 1
          fi

          mapfile -t DATABASE_PATHS < <(
            tar -tzf "${IMAGE_ARCHIVES[0]}" |
              grep -E '(^|/)calculadora-pro\.db$' || true
          )

          if [ "${#DATABASE_PATHS[@]}" -ne 1 ]; then
            echo "::error::Esperado exatamente um calculadora-pro.db na imagem; encontrados: ${#DATABASE_PATHS[@]}."
            exit 1
          fi

          tar -xOzf "${IMAGE_ARCHIVES[0]}" "${DATABASE_PATHS[0]}" > calculadora-pro.db

          python - <<'PY'
          import os
          import re
          import sqlite3

          connection = sqlite3.connect("file:calculadora-pro.db?mode=ro", uri=True)
          try:
              result = connection.execute("PRAGMA quick_check").fetchone()
              if result != ("ok",):
                  raise SystemExit(f"SQLite quick_check falhou: {result!r}")

              row = connection.execute(
                  "SELECT VRBD_VERSAO_BASE_DADO FROM VERSAO_BASE_DADO "
                  "ORDER BY VRBD_ID DESC LIMIT 1"
              ).fetchone()
              if row is None or not isinstance(row[0], str) or not re.fullmatch(r"V[0-9]{4}", row[0]):
                  raise SystemExit(f"Versão inválida em VERSAO_BASE_DADO: {row!r}")

              short_tag = "v" + row[0][1:]
              print(f"Versão do banco: {short_tag}")
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  print(f"short_tag={short_tag}", file=output)
          finally:
              connection.close()
          PY

          zip -q calculadora-pro.db.zip calculadora-pro.db

      - name: Resolve tag name
        id: resolve_tag
        if: env.is_new_version == 'true'
        run: |
          SHORT_TAG="${{ steps.database.outputs.short_tag }}"
          echo "Short tag candidate: $SHORT_TAG"

          # Check whether the short tag already exists in the remote
          git fetch --tags --quiet
          if git rev-parse "refs/tags/$SHORT_TAG" >/dev/null 2>&1; then
            echo "Tag $SHORT_TAG already exists. Building long tag."

            # Use the modification date of codigo-fonte-backend.zip captured after extraction
            ISO_DATE="${{ steps.check_version.outputs.source_zip_date }}"

            if [ -z "$ISO_DATE" ]; then
              # Fallback já gerando no formato seguro com hifens
              SAFE_DATE=$(date +'%Y-%m-%dT%H-%M-%S')
            else
              # Sanitiza a data recebida substituindo ':' por '-' usando string replacement do bash
              SAFE_DATE="${ISO_DATE//:/-}"
            fi

            TAG_NAME="${SHORT_TAG}-${SAFE_DATE}"
          else
            TAG_NAME="$SHORT_TAG"
          fi

          echo "Final tag name: $TAG_NAME"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Unzip and commit if new version
        if: env.is_new_version == 'true'
        run: |
          SOURCE_ZIP="${{ steps.check_version.outputs.source_zip }}"
          TAG_NAME="${{ steps.resolve_tag.outputs.tag_name }}"

          # Clear the source folder completely before extracting
          rm -rf source
          mkdir source

          unzip -q "$SOURCE_ZIP" -d source

          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add source source.md5
          git commit -m "Update source calculadora version ${TAG_NAME}"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tags (Version and Latest)
        if: env.is_new_version == 'true'
        run: |
          TAG_NAME="${{ steps.resolve_tag.outputs.tag_name }}"

          # Cria e envia a tag da versão no novo commit
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          # Força a tag 'latest' a apontar para este novo commit
          git tag -f latest
          git push -f origin latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename source zip for release
        if: env.is_new_version == 'true'
        run: |
          SOURCE_ZIP="${{ steps.check_version.outputs.source_zip }}"
          cp "$SOURCE_ZIP" source.zip

      - name: Create versioned Release
        if: env.is_new_version == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Alterado de GITHUB_TOKEN para GH_TOKEN
        run: |
          TAG_NAME="${{ steps.resolve_tag.outputs.tag_name }}"

          # Cria o release da versão específica usando o GitHub CLI
          gh release create "$TAG_NAME" \
            source.zip \
            calculadora-pro.db.zip \
            --title "Calculadora RTC $TAG_NAME" \
            --notes "Código fonte e banco de dados da Calculadora RTC: $TAG_NAME"
